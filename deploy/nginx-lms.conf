# /etc/nginx/sites-available/lms.smp5tegal.sch.id
# Pola sama dgn mpi/presensi: origin di belakang Cloudflare Tunnel, listen 80 saja.
server {
    listen 80;
    listen [::]:80;
    server_name lms.smp5tegal.sch.id;

    # unggah materi/tugas maks 20 MB + margin (PRD §5 Modul 1)
    client_max_body_size 25m;

    access_log /var/log/nginx/lms.access.log;
    error_log  /var/log/nginx/lms.error.log;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
