# TAMBAHKAN 2 baris ingress ini ke /etc/cloudflared/config.yml yang SUDAH ADA
# (jangan timpa file!). PRD §2A B12: backup dulu, validasi, restart di luar jam sekolah.
#
#   sudo cp /etc/cloudflared/config.yml /etc/cloudflared/config.yml.bak-$(date +%F)
#   … edit: sisipkan blok di bawah, sebelum ingress fallback http_status:404 …
#   sudo cloudflared tunnel ingress validate -f /etc/cloudflared/config.yml 2>/dev/null \
#     || sudo cloudflared validate
#   sudo systemctl restart cloudflared   # ← HANYA di luar jam ujian/sekolah
#
# INDENTASI 2 SPASI — sama persis dgn hostname ujian/mpi/presensi yang sudah jalan.

ingress:
  # --- ... entries ujian/mpi/presensi yang sudah ada ... ---
  - hostname: lms.smp5tegal.sch.id
    service: http://localhost:80

  # Fallback wajib tetap paling akhir:
  # - service: http_status:404
